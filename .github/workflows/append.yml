name: 待入库自动追加

on:
  push:
    branches: [main]
    paths:
      - "待入库/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: append-queue
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 下载直链、逐个追加并校验
        id: doit
        run: |
          shopt -s nullglob
          mkdir -p 已入库 运行记录
          log=运行记录/最近入库.log
          {
            echo "运行时间(UTC)：$(date -u '+%F %T')"
            echo "触发提交：$GITHUB_SHA"
          } > "$log"
          for u in 待入库/*.url; do
            url=$(sed -n '1p' "$u" | tr -d '\r')
            want=$(sed -n '2p' "$u" | tr -d '\r ')
            out="待入库/$(basename "${u%.url}").json"
            echo "== 下载 $u ==" | tee -a "$log"
            curl -fsSL --retry 3 "$url" -o "$out"
            if [ -n "$want" ]; then
              echo "$want  $out" | sha256sum -c - | tee -a "$log"
            else
              sha256sum "$out" | tee -a "$log"
            fi
            mv "$u" "已入库/$(date +%Y%m%d-%H%M%S)__$(basename "$u")"
          done
          files=(待入库/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "无待入库 JSON，跳过" | tee -a "$log"
            echo "changed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "== 追加 $f ==" | tee -a "$log"
            python "追加提示词.py" "视频提示词库-多模型.html" "$f" | tee -a "$log"
            mv "$f" "已入库/$(date +%Y%m%d-%H%M%S)__$(basename "$f")"
          done
          python "库维护工具.py" verify "视频提示词库-多模型.html" | tee -a "$log"
          grep -oE '"全库指纹"[^,}]*' "视频提示词库-多模型.html" | head -1 | tee -a "$log" || true
          echo "changed=1" >> "$GITHUB_OUTPUT"

      - name: 同步 README 统计（随入库提交一并生效）
        if: steps.doit.outputs.changed == '1'
        run: python "同步README统计.py" "视频提示词库-多模型.html" | tee -a 运行记录/最近入库.log

      - name: 提交入库结果
        if: steps.doit.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          msg=$(grep -oE '入库 [0-9]+ 条（[0-9]+ → [0-9]+' 运行记录/最近入库.log | tail -1 | sed -E 's/入库 ([0-9]+) 条（[0-9]+ → ([0-9]+)/CI 自动入库：追加 \1 条 → 共 \2 条/' || true)
          git commit -m "${msg:-CI 自动入库：处理待入库批次}"
          git push
