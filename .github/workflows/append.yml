name: 待入库自动追加
on:
  push:
    branches: [main]
    paths:
      - "待入库/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: append-queue
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 逐个追加并校验
        id: doit
        run: |
          shopt -s nullglob
          files=(待入库/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "无待入库 JSON，跳过"
            echo "changed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "== 追加 $f =="
            python "追加提示词.py" "视频提示词库-多模型.html" "$f"
            mkdir -p 已入库
            mv "$f" "已入库/$(date +%Y%m%d-%H%M%S)__$(basename "$f")"
          done
          python "库维护工具.py" verify "视频提示词库-多模型.html"
          echo "changed=1" >> "$GITHUB_OUTPUT"
      - name: 提交入库结果
        if: steps.doit.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "CI 自动入库：处理 待入库/ 批次"
          git push
